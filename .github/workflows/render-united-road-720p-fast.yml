name: Fast United Road 720p from cache

on:
  push:
    branches:
      - ccr-703a2362-lbr343
    paths:
      - .github/workflows/render-united-road-720p-fast.yml

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { idx: '00', start: '0', end: '10' }
          - { idx: '01', start: '10', end: '20' }
          - { idx: '02', start: '20', end: '30' }
          - { idx: '03', start: '30', end: '40' }
          - { idx: '04', start: '40', end: '50' }
          - { idx: '05', start: '50', end: '60' }
          - { idx: '06', start: '60', end: '70' }
          - { idx: '07', start: '70', end: '80' }
          - { idx: '08', start: '80', end: '90' }
          - { idx: '09', start: '90', end: '100' }
          - { idx: '10', start: '100', end: '110' }
          - { idx: '11', start: '110', end: '120' }
          - { idx: '12', start: '120', end: '130' }
          - { idx: '13', start: '130', end: '140' }
          - { idx: '14', start: '140', end: '150' }
          - { idx: '15', start: '150', end: '160' }
          - { idx: '16', start: '160', end: '170' }
          - { idx: '17', start: '170', end: '180' }
          - { idx: '18', start: '180', end: '190' }
          - { idx: '19', start: '190', end: '200' }
          - { idx: '20', start: '200', end: '210' }
          - { idx: '21', start: '210', end: '220' }
          - { idx: '22', start: '220', end: '230' }
          - { idx: '23', start: '230', end: '234.60' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libsndfile1 unzip
      - name: Python packages
        run: python -m pip install -r requirements.txt
      - name: Restore known-good render cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/11357383123/zip > cache.zip
          unzip -q cache.zip -d .
          test -f episodes/united-road-take-me-home/build/episode_audio.wav
          test -f episodes/united-road-take-me-home/build/song.json
      - name: Render section with latest merged code
        env:
          EP_RES: 1280x720
          FILM_MEM_GB: '5.2'
        run: |
          python -m studio.film united-road-take-me-home render --jobs 1 --chunks 4 --range ${{ matrix.start }} ${{ matrix.end }}
          mkdir -p pieces
          cp episodes/united-road-take-me-home/build/preview.mp4 pieces/piece-${{ matrix.idx }}.mp4
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration -of default=noprint_wrappers=1 pieces/piece-${{ matrix.idx }}.mp4
      - name: Upload section
        uses: actions/upload-artifact@v4
        with:
          name: united-road-fast-piece-${{ matrix.idx }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: pieces/piece-${{ matrix.idx }}.mp4

  finish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
      - name: Restore soundtrack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/11357383123/zip > cache.zip
          unzip -q cache.zip -d .
      - name: Download sections
        uses: actions/download-artifact@v4
        with:
          pattern: united-road-fast-piece-*
          path: pieces
          merge-multiple: true
      - name: Join sections and mux soundtrack
        run: |
          : > parts.txt
          for f in $(find pieces -maxdepth 1 -name 'piece-*.mp4' -printf '%f\n' | sort); do
            printf "file 'pieces/%s'\n" "$f" >> parts.txt
          done
          cat parts.txt
          test "$(wc -l < parts.txt)" -eq 24
          ffmpeg -y -loglevel error -f concat -safe 0 -i parts.txt -an -c:v copy video-only.mp4
          ffmpeg -y -loglevel error -i video-only.mp4 -i episodes/united-road-take-me-home/build/episode_audio.wav             -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 256k -shortest -movflags +faststart             United_Road_Take_Me_Home_FINAL_720p_LATEST.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size             -of default=noprint_wrappers=1 United_Road_Take_Me_Home_FINAL_720p_LATEST.mp4
      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: united-road-final-720p-latest-fast
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: United_Road_Take_Me_Home_FINAL_720p_LATEST.mp4
