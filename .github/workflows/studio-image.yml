name: Web studio image
# Builds the Docker image the web studio is hosted from (Dockerfile, DEPLOY.md), starts it with a password and a
# data disk, and produces a short episode through its API the way the phone app does (tools/smoke_web.py).

on:
  push:
    branches:
      - ccr-f4dd32a3-9dh7nw
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - tools/serve.sh
      - tools/smoke_web.py
      - studio/**
      - .github/workflows/studio-image.yml
  pull_request:
    paths:
      - Dockerfile
      - studio/web/**
      - tools/serve.sh
      - .github/workflows/studio-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t animation-studio .
      - name: Start it (password, data disk)
        run: |
          docker volume create studio-data
          docker run -d --name studio -p 8000:8000 -v studio-data:/data \
            -e STUDIO_PASSWORD=smoke-test -e STUDIO_JOBS=4 -e FILM_MEM_GB=10 animation-studio
      - name: It refuses to start without a password
        run: |
          if docker run --rm -e STUDIO_DATA= animation-studio timeout 20 bash tools/serve.sh; then
            echo "started without a password"; exit 1; fi
      - name: Produce an episode through the API
        run: |
          pip install pillow
          python3 tools/smoke_web.py http://localhost:8000 smoke-test
      - name: Server log
        if: always()
        run: docker logs studio 2>&1 | tail -150
