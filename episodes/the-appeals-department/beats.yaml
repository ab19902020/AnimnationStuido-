# Timing choices for the timeline (studio/episode/timeline.py).
#
# holds: how a scene's visual/reaction allowance (pack/Scene_Timing.csv) is shared out between its stage directions.
#   w   = relative share of the allowance
#   min = seconds at least: the director wants every crucial insert (reader total, LITTLE CRIS badge, refund
#         total, sponsor label) held 1.2-1.8 s so it reads on a phone, and Roy's look after Ronaldo's advice 1 s
# pauses: extra seconds of silence after a line, on top of the normal gap: a reaction held before the next line
gap: {other_speaker: 0.28, same_speaker: 0.42}
lead_in: 0.6          # seconds of room tone before the first word
end_card: 2.5         # seconds of END card after the last beat
holds:
  D1.1: {w: 0.2, min: 0.0}      # the opening reveal plays over Gary's first line
  D1.2: {w: 1.3, min: 2.0}
  D1.3: {w: 1.0, min: 1.8}
  D2.1: {w: 1.6, min: 2.4}      # the reader total must register
  D2.2: {w: 1.8, min: 3.0}      # the paper strip across the floor; Roy steps over it
  D2.3: {w: 1.2, min: 2.2}      # the suitcase wheel pins the paper; Ronaldo
  D3.1: {w: 1.6, min: 2.4}      # almost-sit and recoil; Roy's eyes
  D3.2: {w: 1.0, min: 1.8}      # +19.99
  D3.3: {w: 0.8, min: 1.4}
  D3.4: {w: 1.4, min: 2.0}      # sign flips to PRIVATE HEARING
  D4.1: {w: 1.2, min: 2.2}      # the curtain track
  D4.2: {w: 1.2, min: 1.8}      # LITTLE CRIS badge
  D4.3: {w: 1.0, min: 1.6}      # clipboard lands
  D5.1: {w: 1.3, min: 2.0}
  D5.2: {w: 0.9, min: 1.4}      # the whistle that is not played
  D5.3: {w: 0.8, min: 1.4}      # the empty mug sip
  D6.1: {w: 1.2, min: 2.0}      # Pep's eye-line to UNDER-14s GO FREE
  D6.2: {w: 2.0, min: 2.6}      # chime, REFUND DUE, Gary freezes
  D6.3: {w: 1.3, min: 2.2}      # forms fall on Gary
  D6.4: {w: 1.0, min: 1.8}      # the thump; the bench in the centre
  D7.1: {w: 1.5, min: 2.4}      # Gary sits
  D7.2: {w: 0.6, min: 1.0}      # Roy's one-second look
  D7.3: {w: 1.5, min: 1.8}      # the sponsor label
  D7.4: {w: 2.0, min: 3.0}      # wide; they leave; printer; the click
pauses:
  L006: 0.35
  L008: 0.2
  L014: 0.3
  L026: 0.25
  L028: 0.3
  L038: 0.5
  L045: 0.2
  L048: 0.3
  L057: 0.25
  L066: 0.3
  L071: 0.3
  L081: 0.2
  L084: 0.3
  L090: 0.3
  L093: 0.4
