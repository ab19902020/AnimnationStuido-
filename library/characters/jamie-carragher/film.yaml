  thumb: {sheet: reference/poses-seated-1.png, box: [81, 683, 503, 1369], faces: F, main: true, ed: 59, jaw: 1.8}
  arms: {sheet: reference/poses-seated-1.png, box: [478, 682, 1122, 1368], faces: F, main: true, ed: 59, close_mouth: [795, 848, 21, 10], close_fit: true, jaw: 1.8}
