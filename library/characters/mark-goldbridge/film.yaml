# Drawings this character is filmed in (studio/film/art.py): each is cut whole from its sheet, upscaled 4x and
# given face landmarks. Check build/film/mark-goldbridge_check.jpg after any change.
# The seated pose sheets are drawn to one scale (head height ~255 sheet px in every pose, both men): every drawing
# is sized by the same eye distance, `ed: 59`, so heads match from cut to cut whichever way the eyes look. `jaw`
# opens the mouths wider than the default: their mouths are drawn small for the face (a moustache and stubble
# hide the rest), so at a normal speaking level the default jaw drop is only a slit; the shouts open more, the wide
# smirks less. Mouths drawn narrower than 36 px get `marks: mouth` 40 px wide about their own centre, so every pose
# opens alike.
